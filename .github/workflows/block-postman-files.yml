name: Block Postman files in development

on:
  pull_request:
    branches:
      - development

jobs:
  block-postman-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin ${{ github.event.pull_request.base.ref }}

      - name: Get changed files
        id: changes
        run: |
          echo "Comparing with base: ${{ github.event.pull_request.base.ref }}"
          CHANGED=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD || true)
          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Fail if Postman files present
        run: |
          echo "Changed files:"
          echo "${{ steps.changes.outputs.changed_files }}"
          if printf '%s\n' "${{ steps.changes.outputs.changed_files }}" | grep -E '(^|/)(collections|\.postman|environments|globals)(/|$)'; then
            echo "❌ Postman files detected in PR. Blocking merge to development."
            exit 1
          fi

